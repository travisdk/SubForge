# Experiment: does SubForge build and load on macOS (CLAP + VST3)?
# Deliberately separate from build.yml: it runs only when the branch "macos-test" is pushed
# (or started by hand) and never produces release archives. There is no macOS release yet.
name: macOS check

on:
  push:
    branches: ["macos-test"]
  workflow_dispatch:

permissions:
  contents: read

# Dependencies are pinned to exact commits/tags, as in build.yml.
env:
  JUCE_VERSION: "8.0.15"
  JUCE_COMMIT: 91ad83ae34a81e0833b1a2b0866f54846370ae53   # the commit of tag 8.0.15
  CLAP_JUCE_EXTENSIONS_COMMIT: 7adee3a1bd4684d4caa5601100e364abccff4b4d
  PLUGINVAL_VERSION: "v1.0.4"          # VST3 validator (run only, not shipped)
  CLAP_VALIDATOR_VERSION: "0.4.1"      # CLAP validator (run only, not shipped)

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: brew install ninja

      - name: Fetch JUCE and clap-juce-extensions
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git _sdks/JUCE
          test "$(git -C _sdks/JUCE rev-parse HEAD)" = "$JUCE_COMMIT" || { echo "JUCE tag $JUCE_VERSION has moved"; exit 1; }
          git clone https://github.com/free-audio/clap-juce-extensions.git _sdks/clap-juce-extensions
          git -C _sdks/clap-juce-extensions checkout "$CLAP_JUCE_EXTENSIONS_COMMIT"
          git -C _sdks/clap-juce-extensions submodule update --init --recursive

      - name: Configure (Intel + Apple Silicon, macOS 11 and newer)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DJUCE_DIR=_sdks/JUCE
          -DCLAP_JUCE_EXTENSIONS_DIR=_sdks/clap-juce-extensions
          -DSUBFORGE_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: >
          cmake --build build --parallel
          --target SubForge_CLAP SubForge_VST3 SubForge_AU
          test_presets test_patterns test_sequencer test_filter_curve test_oscillator test_voice test_levels test_loading

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Trim the AU plist and ad-hoc sign all three bundles
        run: |
          # JUCE adds network.client to the AU's resourceUsage by default. SubForge uses no network
          # (no sockets, no downloads, no browser), so that permission is removed. The file access
          # entry stays: presets and patterns are saved in ~/Documents/SubForge.
          AU=build/SubForge_artefacts/Release/AU/SubForge.component
          /usr/libexec/PlistBuddy -c "Delete :AudioComponents:0:resourceUsage:network.client" "$AU/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :AudioComponents:0:resourceUsage" "$AU/Contents/Info.plist"
          # Ad-hoc signature (no certificate), the same for all three. It must come after the plist edit.
          for b in "$AU" build/SubForge_artefacts/Release/VST3/SubForge.vst3 build/SubForge_artefacts/Release/CLAP/SubForge.clap; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Show what was built
        run: |
          find build -name "SubForge.vst3" -o -name "SubForge.clap" | head
          lipo -archs "build/SubForge_artefacts/Release/VST3/SubForge.vst3/Contents/MacOS/SubForge"

      - name: Download validators
        run: |
          mkdir -p _tools/pluginval _tools/clap-validator
          gh release download "$PLUGINVAL_VERSION" -R Tracktion/pluginval -p pluginval_macOS.zip -D _tools/pluginval
          gh release download "$CLAP_VALIDATOR_VERSION" -R free-audio/clap-validator -p "*macos-universal*" -D _tools/clap-validator
          unzip -q _tools/pluginval/pluginval_macOS.zip -d _tools/pluginval
          cd _tools/clap-validator && unzip -q *.zip && tar xzf *.tar.gz && cd ../..
          find _tools -maxdepth 3 -not -name "*.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate VST3 (pluginval, strictness 5)
        run: >
          _tools/pluginval/pluginval.app/Contents/MacOS/pluginval
          --strictness-level 5 --validate-in-process
          build/SubForge_artefacts/Release/VST3/SubForge.vst3

      - name: Validate CLAP (clap-validator)
        run: |
          VALIDATOR="$(find _tools/clap-validator -type f -name clap-validator | head -1)"
          chmod +x "$VALIDATOR"
          "$VALIDATOR" validate build/SubForge_artefacts/Release/CLAP/SubForge.clap

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto build/SubForge_artefacts/Release/AU/SubForge.component ~/Library/Audio/Plug-Ins/Components/SubForge.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -a | grep -i SbFg
          auval -v aumu SbFg Hjuh

      - name: Collect the plug-ins
        run: |
          mkdir -p out
          ditto build/SubForge_artefacts/Release/VST3/SubForge.vst3 out/SubForge.vst3
          ditto build/SubForge_artefacts/Release/CLAP/SubForge.clap out/SubForge.clap
          ditto build/SubForge_artefacts/Release/AU/SubForge.component out/SubForge.component

      - name: Pack the test zip
        run: |
          rm -rf pack && mkdir -p pack/SubForge-macOS-test
          cp -R out/* pack/SubForge-macOS-test/
          cp LICENSE pack/SubForge-macOS-test/LICENSE.txt
          cp THIRD-PARTY-NOTICES.txt pack/SubForge-macOS-test/
          cp packaging/INSTALL-macos.txt pack/SubForge-macOS-test/INSTALL.txt
          (cd pack && ditto -c -k --keepParent SubForge-macOS-test SubForge-macOS-test.zip)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubForge-macOS-test
          path: pack/SubForge-macOS-test.zip
          if-no-files-found: error
